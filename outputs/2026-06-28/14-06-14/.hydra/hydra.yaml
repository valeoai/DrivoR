hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - pkg://navsim.planning.script.config.common
  - pkg://navsim.planning.script.config.training
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.searchpath=[pkg://navsim.planning.script.config.common,pkg://navsim.planning.script.config.training]
    - hydra.mode=RUN
    task:
    - experiment_name=2026-06-28
  job:
    name: run_training_full
    chdir: null
    override_dirname: experiment_name=2026-06-28
    id: ???
    num: ???
    config_name: drivor_v2_debugger
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /fs/nexus-projects/sim2real/aliu/DrivoR
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /fs/nexus-projects/sim2real/aliu/DrivoR/my_configs
      schema: file
      provider: main
    - path: navsim.planning.script.config.common
      schema: pkg
      provider: hydra.searchpath in command-line
    - path: navsim.planning.script.config.training
      schema: pkg
      provider: hydra.searchpath in command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: /fs/nexus-projects/sim2real/aliu/DrivoR/outputs/2026-06-28/14-06-14
    choices:
      agent: drivoR
      worker: ray_distributed_no_torch
      train_test_split_synthetic: synthetic_reaction_pdm_v1.0
      train_test_split_synthetic/scene_filter: synthetic_reaction_pdm_v1.0
      train_test_split: navtrain
      train_test_split/scene_filter: navtrain
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
