hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  job:
    chdir: False

defaults:
  - drivor_v2
  - _self_

dataloader:
  params:
    batch_size: 10
    num_workers: 4
    pin_memory: false
    prefetch_factor: 2

trainer:
  params:
    max_epochs: 40

agent:
  num_gpus: 8
  lr_args:
    base_lr: 0.0001
  config:
    freeze_perception: true
    use_adapter: true

sim_data_ratio: 0.5
sim_data_mode: balanced
sim_log_path: /fs/nexus-projects/sim2real/aliu/carla_data_split/openscene_meta_datas
sim_sensor_path: /fs/nexus-projects/sim2real/aliu/carla_data_split/sensor_blobs

train_test_split:
  scene_filter:
    max_scenes: 12910
    max_samples: 2560
